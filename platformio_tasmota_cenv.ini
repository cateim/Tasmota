; platformio_tasmota_cenv.ini
;
; Ambientes customizados das placas KinCony da casa.
;
; Este e o arquivo que o Tasmota reserva para ambiente customizado: o
; platformio.ini o carrega por ultimo em extra_configs, e o upstream nunca o
; edita, entao um rebase na development nao gera conflito aqui. Ele e ignorado
; pelo .gitignore do projeto, e por isso entrou no indice com "git add -f":
; uma vez rastreado, o .gitignore nao o alcanca mais, e o CI do fork o enxerga.
;
; O bloco [tasmota] do platformio_tasmota_cenv_sample.ini NAO e reproduzido de
; proposito: ele zera build_flags e build_unflags de todos os ambientes, e os
; dois daqui dependem justamente das flags que o env:tasmota32s3 traz.

[env:tasmota32s3-a16v3]
; Build da KinCony KC868-A16 v3, com tudo o que a placa tem.
; Pinagem oficial: forum da KinCony, tid=7614.
;   16 reles  PCF8574 0x24 e 0x25   16 entradas  PCF8574 0x21 e 0x22
;   I2C       SDA 9, SCL 10         RTC DS3231 0x68, LCD SSD1306 0x3C, EEPROM 0x50
;   Ethernet  W5500 clk42 mosi43 miso44 cs15 int2 rst1
;   RS485     RXD 17, TXD 16        Analogicas  A1..A4 em 4, 6, 7, 5
;   1-Wire    47, 48, 38 (pull-up no PCB)   GPIOs livres  39, 40, 41
;   RF 433    receptor 8, emissor 18        Cartao SD  mosi12 sck13 miso14 cs11
; O tasmota32s3 ja traz ethernet, SPI, I2C, ADC, DS18x20, WS2812, serial bridge,
; modbus bridge e o RF por RC-Switch. O que falta e declarado abaixo.
extends                 = env:tasmota32s3
build_flags             = ${env:tasmota32s3.build_flags}
; Comentados em TODAS as configuracoes do Tasmota, inclusive no build oficial do S3:
                          -DUSE_PCF8574
                          -DUSE_DS3231
; LCD de bordo:
                          -DUSE_DISPLAY
                          -DUSE_DISPLAY_SSD1306
; RS485 exposto na rede, e o RF declarado de proposito para a auditoria do binario pegar:
                          -DUSE_TCP_BRIDGE
                          -DUSE_RC_SWITCH
                          -DUSE_RF_SENSOR
                          -DOTA_URL='""'

[env:tasmota32s3-ag8]
; Build da KinCony AG8: tudo o que a placa tem, mais o driver IR completo.
; Parte do tasmota32s3 (FIRMWARE_TASMOTA32), que traz ethernet, SPI, I2C,
; DS18x20, DHT, serial bridge, modbus bridge, WS2812 e mDNS, e acrescenta
; o USE_IR_REMOTE_FULL, que e o que habilita o IRsend com Channel e os
; protocolos de ar-condicionado. O preset FIRMWARE_IR nao serve aqui:
; ele desliga 97 funcoes, incluindo o SPI de que a ethernet W5500 depende.
extends                 = env:tasmota32s3
build_flags             = ${env:tasmota32s3.build_flags}
                          -DUSE_IR_REMOTE_FULL
; O build padrao nao traz estes, e a AG8 usa os tres:
                          -DUSE_MODBUS_BRIDGE
                          -DUSE_TCP_BRIDGE
                          -DUSE_MAX31865
                          -DUSE_PING
; OTA_URL vazio de proposito: apontar para o tasmota32s3.bin oficial faria
; um "upgrade" trocar este firmware por um sem IR completo.
                          -DOTA_URL='""'
