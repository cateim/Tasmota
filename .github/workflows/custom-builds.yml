# .github/workflows/custom-builds.yml
#
# So para o fork. Os workflows oficiais do Tasmota sao guardados por
# "if: github.repository == 'arendst/Tasmota'", entao nao rodam em fork nenhum.
# Este compila os firmwares das placas da casa e publica os binarios:
#
#   tasmota32s3-ag8    firmware da KinCony AG8, IR completo mais ethernet
#   tasmota32s3-a16v3  firmware da KinCony A16v3, PCF8574 mais ethernet
#
# Todo push na tasmota-kincony vira uma release kincony-AAAAMMDD-<sha>, marcada
# como a mais recente. E dela que o web flasher (self-labs/tasmota-kincony)
# puxa os binarios: o artefato do Actions expira em 90 dias e exige login para
# baixar, a release nao.
#
# NAO entra em pull request nenhum: os PRs levam so o diff da correcao.
name: Custom Tasmota builds

on:
  workflow_dispatch: # botao "Run workflow" na aba Actions
  push:
    branches: [tasmota-kincony]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # publicar a release com os binarios
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false
      - name: Install dependencies
        run: uv pip install --system pioarduino
      - name: Build tasmota32s3-ag8
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        run: platformio run -e tasmota32s3-ag8
      - name: Build tasmota32s3-a16v3
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        run: platformio run -e tasmota32s3-a16v3
      - uses: actions/upload-artifact@v7
        with:
          name: firmware
          path: ./build_output
      - name: Publicar a release
        # So no push da branch da casa. Um "Run workflow" manual so compila.
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          short="${GITHUB_SHA::7}"
          tag="kincony-$(date -u +%Y%m%d)-${short}"
          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --title "$tag" \
            --notes "Firmwares da casa, compilados do commit ${short} da branch tasmota-kincony. O .factory.bin grava no offset 0x0 numa placa vazia ou vinda de outro firmware; o .bin serve para OTA." \
            --latest \
            build_output/firmware/tasmota32s3-ag8.factory.bin \
            build_output/firmware/tasmota32s3-ag8.bin \
            build_output/firmware/tasmota32s3-a16v3.factory.bin \
            build_output/firmware/tasmota32s3-a16v3.bin
